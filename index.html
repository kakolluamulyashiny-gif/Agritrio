<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agritrio — Farmer Dashboard (Single-file React)</title>
  <!-- Fonts & icons (optional) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ======= CSS: single-file dashboard styling ======= */
    :root{
      --bg:#0f1724; --card:#0b1220; --muted:#94a3b8; --accent:#10b981; --glass: rgba(255,255,255,0.04);
      --glass-2: rgba(255,255,255,0.03);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    html,body,#root{height:100%;}
    body{
      margin:0; background:linear-gradient(180deg,#071027 0%, #0b1530 100%); color:#e6eef8; -webkit-font-smoothing:antialiased;
    }
    .app{display:flex;min-height:100vh;gap:18px;padding:24px;box-sizing:border-box}
    .sidebar{width:260px;background:linear-gradient(180deg,var(--card),#07101a);border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:14px}
    .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#06b6d4);display:flex;align-items:center;justify-content:center;font-weight:700}
    .nav{margin-top:8px}
    .nav button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:10px;border-radius:8px;color:var(--muted);cursor:pointer}
    .nav button:hover{background:var(--glass);color:#fff}
    .nav button.active{background:linear-gradient(90deg, rgba(16,185,129,0.12), rgba(6,182,212,0.06));color:#fff}
    .main{flex:1;display:flex;flex-direction:column;gap:18px}
    .topbar{display:flex;justify-content:space-between;align-items:center}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{background:linear-gradient(180deg,var(--glass),var(--glass-2));padding:16px;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02)}
    .small{font-size:12px;color:var(--muted)}
    .big{font-size:20px;font-weight:600}
    .market-list{max-height:260px;overflow:auto;margin-top:8px}
    .market-row{display:flex;justify-content:space-between;padding:8px;border-radius:8px}
    .tips{display:flex;flex-direction:column;gap:8px}
    .marketplace{display:grid;grid-template-columns:1fr 360px;gap:18px}
    .form input, .form textarea{width:100%;padding:10px;border-radius:8px;border:0;background:rgba(255,255,255,0.02);color:inherit}
    .btn{background:var(--accent);border:0;padding:10px 12px;border-radius:8px;color:#032;cursor:pointer;font-weight:600}
    .camera-preview{width:100%;height:240px;background:#061220;border-radius:8px;display:flex;align-items:center;justify-content:center}
    footer{opacity:0.7;font-size:13px}
    @media (max-width:980px){
      .app{flex-direction:column;padding:12px}
      .sidebar{width:100%;display:flex;flex-direction:row;overflow:auto}
      .cards{grid-template-columns:repeat(1,1fr)}
      .marketplace{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM + Babel (for single-file JSX) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
  <!-- Chart.js for price charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- ======= Single-file React app (JSX) ======= -->
  <script type="text/babel">
    const {useState, useEffect, useRef} = React;

    /* ---------- Mock helpers ---------- */
    // NOTE: these functions simulate API calls. Replace URLs with your real endpoints.
    async function fetchWeatherForCity(city='Your Location'){
      // Example: replace with fetch('https://api.openweathermap.org/data/2.5/weather?q='+city+'&appid=YOUR_KEY')
      return new Promise(r => setTimeout(()=> r({temp: Math.round(20 + Math.random()*10), condition: 'Partly Cloudy', humidity: 56}), 400));
    }
    async function fetchMarketPrices(){
      // Replace with your market price API
      return new Promise(r => setTimeout(()=> r([
        {crop:'Wheat', price: 2150}, {crop:'Rice', price: 2520}, {crop:'Corn', price: 1800}, {crop:'Tomato', price: 32},
      ]),300));
    }

    /* ---------- Small UI components ---------- */
    function Sidebar({active,setActive}){
      return (
        <aside className="sidebar">
          <div className="brand">
            <div className="logo">A</div>
            <div>
              <div style={{fontWeight:700}}>Agritrio</div>
              <div className="small">Farmers' dashboard</div>
            </div>
          </div>
          <nav className="nav">
            {['Dashboard','Marketplace','Crop Tips','Camera'].map(item=> (
              <button key={item} className={active===item? 'active':''} onClick={()=>setActive(item)}>{item}</button>
            ))}
          </nav>
          <div style={{marginTop:18}} className="small">Logged in as <strong>Farmer</strong></div>
        </aside>
      )
    }

    function WeatherCard({city}){
      const [w,setW] = useState(null);
      useEffect(()=>{ let mounted=true; fetchWeatherForCity(city).then(d=> mounted && setW(d)); return ()=> mounted=false },[city]);
      return (
        <div className="card">
          <div className="small">Weather — {city}</div>
          {w? (
            <div style={{marginTop:8}}>
              <div className="big">{w.temp}°C</div>
              <div className="small">{w.condition} • Humidity {w.humidity}%</div>
            </div>
          ) : <div className="small">Loading...</div>}
        </div>
      )
    }

    function PricesCard(){
      const [prices,setPrices] = useState([]);
      useEffect(()=>{ fetchMarketPrices().then(setPrices) },[]);
      return (
        <div className="card">
          <div className="small">Market Prices</div>
          <div className="market-list">
            {prices.map(p=> (
              <div key={p.crop} className="market-row">
                <div>{p.crop}</div>
                <div style={{fontWeight:700}}>₹ {p.price}</div>
              </div>
            ))}
          </div>
        </div>
      )
    }

    function PriceChart({data}){
      const ref = useRef();
      useEffect(()=>{
        if(!ref.current) return;
        const ctx = ref.current.getContext('2d');
        let chart = new Chart(ctx,{
          type:'line',
          data:{labels:data.map(d=>d.crop), datasets:[{label:'Price (₹)', data:data.map(d=>d.price), tension:0.3}]},
          options:{responsive:true, plugins:{legend:{display:false}}}
        });
        return ()=>{ chart.destroy() }
      },[data]);
      return <canvas ref={ref} style={{width:'100%',height:160}} />
    }

    function Marketplace(){
      const [listings,setListings] = useState(()=> JSON.parse(localStorage.getItem('listings')||'[]'));
      const [form,setForm] = useState({title:'',crop:'',qty:'',price:''});
      function addListing(e){ e.preventDefault(); const n = {...form,id:Date.now()}; const newL=[n,...listings]; setListings(newL); localStorage.setItem('listings', JSON.stringify(newL)); setForm({title:'',crop:'',qty:'',price:''}) }
      function remove(id){ const newL = listings.filter(l=>l.id!==id); setListings(newL); localStorage.setItem('listings', JSON.stringify(newL)); }
      return (
        <div className="marketplace">
          <div>
            <div className="card">
              <div className="small">Sell produce</div>
              <form className="form" onSubmit={addListing} style={{display:'grid',gap:8,marginTop:10}}>
                <input placeholder="Listing title" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} required />
                <input placeholder="Crop (e.g. Wheat)" value={form.crop} onChange={e=>setForm({...form,crop:e.target.value})} required />
                <input placeholder="Quantity (kg)" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} required />
                <input placeholder="Price (per kg)" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} required />
                <div style={{display:'flex',gap:8}}>
                  <button className="btn">Create listing</button>
                  <button type="button" onClick={()=>{setForm({title:'',crop:'',qty:'',price:''})}}>Clear</button>
                </div>
              </form>
            </div>

            <div className="card" style={{marginTop:12}}>
              <div className="small">Your listings</div>
              <div className="market-list">
                {listings.length===0? <div className="small" style={{padding:8}}>No listings yet</div> : listings.map(l=> (
                  <div key={l.id} className="market-row">
                    <div>
                      <div style={{fontWeight:700}}>{l.title}</div>
                      <div className="small">{l.crop} • {l.qty} kg</div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontWeight:700}}>₹{l.price}</div>
                      <div style={{marginTop:6}}>
                        <button onClick={()=>remove(l.id)}>Remove</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <aside>
            <div className="card">
              <div className="small">Top market snapshot</div>
              <PricesCard />
            </div>
            <div className="card" style={{marginTop:12}}>
              <div className="small">Price trends</div>
              <div style={{height:180}}>
                <PriceChart data={[{crop:'Wheat',price:2150},{crop:'Rice',price:2520},{crop:'Corn',price:1800},{crop:'Tomato',price:32}]} />
              </div>
            </div>
          </aside>
        </div>
      )
    }

    function CropTips(){
      const tips = [
        {title:'Soil testing', body:'Get your soil tested every season to use the right fertilizers.'},
        {title:'Irrigation timing', body:'Water early morning or late evening to reduce evaporation.'},
        {title:'Organic pest control', body:'Use neem-based sprays and pheromone traps for pest control.'}
      ];
      return (
        <div className="card">
          <div className="small">Crop care tips</div>
          <div className="tips" style={{marginTop:8}}>
            {tips.map(t=> (
              <div key={t.title} style={{padding:10,background:'rgba(255,255,255,0.02)',borderRadius:8}}>
                <div style={{fontWeight:700}}>{t.title}</div>
                <div className="small">{t.body}</div>
              </div>
            ))}
          </div>
        </div>
      )
    }

    function CameraDetect(){
      const videoRef = useRef();
      const [streaming,setStreaming] = useState(false);
      const [captured,setCaptured] = useState(null);
      useEffect(()=>()=>{ if(videoRef.current && videoRef.current.srcObject){ const tracks = videoRef.current.srcObject.getTracks(); tracks.forEach(t=>t.stop()) } },[]);
      async function startCamera(){
        try{
          const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
          videoRef.current.srcObject = stream; videoRef.current.play(); setStreaming(true);
        }catch(e){ alert('Camera permission denied or not available.') }
      }
      function capture(){
        const canvas = document.createElement('canvas'); canvas.width = videoRef.current.videoWidth; canvas.height = videoRef.current.videoHeight; const ctx = canvas.getContext('2d'); ctx.drawImage(videoRef.current,0,0); const data = canvas.toDataURL('image/jpeg',0.9); setCaptured(data);
      }
      async function sendForDetection(){
        // Example: POST to your detection endpoint with the base64 image
        // fetch('/api/detect',{method:'POST',body:JSON.stringify({image:captured}),headers:{'Content-Type':'application/json'}})
        //  .then(r=>r.json()).then(console.log)
        alert('Captured image would be sent to your detection API. See comments in code for integration.');
      }
      return (
        <div>
          <div className="card">
            <div className="small">Camera & Detection</div>
            <div style={{marginTop:10}}>
              <div className="camera-preview">
                <video ref={videoRef} style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:8}} />
                {!streaming && <div style={{position:'absolute'}}>Camera stopped</div>}
              </div>
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <button className="btn" onClick={startCamera}>Start Camera</button>
                <button onClick={capture}>Capture</button>
                <button onClick={sendForDetection} disabled={!captured}>Send for detection</button>
              </div>
            </div>
            {captured && (
              <div style={{marginTop:10}}>
                <div className="small">Captured snapshot</div>
                <img src={captured} style={{width:'100%',marginTop:8,borderRadius:8}} />
              </div>
            )}
          </div>
        </div>
      )
    }

    function DashboardMain(){
      const [city] = useState('Local Farm');
      const [marketData,setMarketData] = useState([]);
      useEffect(()=>{ fetchMarketPrices().then(setMarketData) },[]);
      return (
        <>
          <div className="cards">
            <WeatherCard city={city} />
            <div className="card">
              <div className="small">Quick actions</div>
              <div style={{display:'flex',gap:8,marginTop:10}}>
                <button className="btn">Create Listing</button>
                <button>Request transport</button>
                <button>Contact buyer</button>
              </div>
              <div style={{marginTop:12}}>
                <div className="small">Recent prices</div>
                <div style={{marginTop:8}}>
                  <div style={{display:'flex',gap:8}}>
                    {marketData.slice(0,3).map(m=> (
                      <div key={m.crop} style={{flex:1,background:'rgba(255,255,255,0.01)',padding:8,borderRadius:8}}>
                        <div style={{fontWeight:700}}>{m.crop}</div>
                        <div className="small">₹{m.price}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <div className="card">
              <div className="small">Alerts</div>
              <div style={{marginTop:8}}>
                <div style={{padding:8,background:'rgba(255,99,71,0.03)',borderRadius:8}}>
                  <div style={{fontWeight:700}}>Pest advisory</div>
                  <div className="small">Locust activity reported nearby — take precautionary measures.</div>
                </div>
              </div>
            </div>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 420px',gap:18}}>
            <div>
              <CropTips />
              <div style={{marginTop:18}}>
                <div className="card">
                  <div className="small">Marketplace highlights</div>
                  <div style={{marginTop:8}}>
                    <PricesCard />
                  </div>
                </div>
              </div>
            </div>
            <aside>
              <div className="card">
                <div className="small">Insights</div>
                <div style={{marginTop:8}}>
                  <div className="small">Profitability: <strong>Moderate</strong></div>
                  <div className="small">Recommended crop rotation: Rice → Legumes</div>
                </div>
              </div>
            </aside>
          </div>
        </>
      )
    }

    function App(){
      const [active,setActive] = useState('Dashboard');
      return (
        <div className="app">
          <Sidebar active={active} setActive={setActive} />
          <main className="main">
            <div className="topbar">
              <div style={{display:'flex',flexDirection:'column'}}>
                <div style={{fontSize:18,fontWeight:700}}>Welcome to Agritrio</div>
                <div className="small">Connected farm tools & quick market access</div>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <div className="small">Balance: ₹ 12,400</div>
                <div style={{width:40,height:40,borderRadius:10,background:'#083045',display:'flex',alignItems:'center',justifyContent:'center'}}>FA</div>
              </div>
            </div>

            <div style={{overflow:'auto',paddingTop:8}}>
              {active==='Dashboard' && <DashboardMain />}
              {active==='Marketplace' && <Marketplace />}
              {active==='Crop Tips' && <CropTips />}
              {active==='Camera' && <CameraDetect />}
            </div>

            <footer style={{marginTop:18}}>
              <div className="small">Agritrio • Built for farmers — demo single-file app</div>
            </footer>
          </main>
        </div>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
